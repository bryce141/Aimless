################################################################################
### Self-hosted openrouteservice, New Jersey only, driving-car only.
###
### Everything not listed here keeps the image defaults. The defaults are in
### example-ors-config.yml next to this file, extracted from the v9.10.0 image
### so there's a local record of what we are and aren't overriding.
################################################################################
ors:
  engine:
    # Serve the graph from disk instead of loading it into heap.
    graphs_data_access: MMAP

    elevation:
      # The default provider ("multi") picks CGIAR at this latitude, and
      # srtm.csi.cgiar.org does not respond at all — connections hang until they
      # time out. GraphHopper wraps that failure as "Could not parse OSM file",
      # which sends you looking at a perfectly good extract for an hour.
      #
      # skadi is the same SRTM data served from AWS S3, and it answers.
      provider: skadi

    profile_default:
      build:
        # Off since 2026-09-03, and this is what makes a country-sized extract
        # affordable. Measured on the NJ+CA graph: build peaked at 4,354 MiB of
        # heap against the 8 GB ceiling with elevation off, and the build ran 40
        # minutes against 48. Elevation also drags an SRTM tile download into
        # the build — the cache is already 6.2 GB for two states, and US-wide it
        # would add hours of fetching from S3 mid-build.
        #
        # Nothing in the app reads it. Loops are ranked on duration and highway
        # share; grade is not an input to either. Turn it back on only if
        # something starts needing gradient, and expect the build cost back.
        elevation: false
        # The whole United States, one Geofabrik file. Was NJ + PA + NY + DE + CA
        # merged with osmium until 2026-09-03; that mode still exists as
        # COVERAGE=nj-ca. See fetch-extract.sh.
        source_file: /home/ors/files/coverage.osm.pbf

    profiles:
      driving-car:
        enabled: true
        build:
          # WayCategory carries the motorway bit the whole app filters on, so
          # this storage is load-bearing rather than optional — without it
          # `waycategory` comes back empty and every loop reads as 0% highway.
          ext_storages:
            WayCategory:
            WaySurfaceType:
            Tollways:
        service:
          # HeiGIT's default is 100000, and that is where
          # RouteService.maxRequestMeters came from — the ceiling was found by
          # hitting HTTP 400 against their instance. It is a config value, not a
          # property of the algorithm, so on our own box it is ours to set.
          maximum_distance_round_trip_routes: 200000
